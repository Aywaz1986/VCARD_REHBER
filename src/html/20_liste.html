<section class="card" id="kartListe">
  <h2>2. Liste <span id="cnt" class="mut"></span></h2>
  <div class="row" style="margin-bottom:8px">
    <input id="q" type="search" placeholder="Ara..." style="min-width:220px">
    <button id="addBtn">+ Satır ekle</button>
    <button id="clrBtn" class="dng">Tümünü temizle</button>
    <span class="grow"></span>
    <label class="btn">Fotoğraf klasörü seç<input id="photoDir" type="file" accept="image/*" webkitdirectory multiple hidden></label>
    <label class="btn">Fotoğrafları toplu seç<input id="photoIn" type="file" accept="image/*" multiple hidden></label>
  </div>
  <p class="hint" style="margin:0 0 8px">Fotoğraflar önce "Fotoğraf" sütunundaki dosya adıyla, yoksa <i>Ad Soyad.jpg</i> adıyla eşleştirilir; otomatik 200×200'e kırpılıp küçültülür.</p>
  <div class="tw"><table id="tbl"></table></div>
  <div class="row pager">
    <button id="pgOnce">‹ Önceki</button>
    <span id="pgBilgi" class="mut"></span>
    <button id="pgSonra">Sonraki ›</button>
    <label>Sayfa boyutu
      <select id="pgBoyut"><option>50</option><option selected>100</option><option>250</option><option>500</option></select>
    </label>
  </div>
</section>
